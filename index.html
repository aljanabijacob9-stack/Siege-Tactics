 if(!TLD.beats){TLD.beats=s==0?[B(3,5.3,0,.6,1.7,u=>[10-u*.6,Math.sin(u*2.8)*1.7]),B(5.3,7.6,1,.8,1.6,u=>[8.5,2.4-u*2.6]),B(7.6,10,2,.7,2.0,u=>[6.5-u*.5,-1.6+u,],{ads:1})]:s==1?[B(6.1,8.7,2,.8,1.9,u=>[10.5-u*1.4,Math.sin(u*2.2)*.9])]:[B(.4,2.7,0,1.0,1.8,u=>[11-u*1.6,Math.sin(u*2.6)*1.5],{ads:1})]}
 if(s==0){
  if(lt<3){TLD.fly=1;TLD.fa=lt*.55+.6}
  else{const w=Math.min(2.4,(lt-3)*1.1);pl.x=X+w;pl.y=Y+Math.sin(lt*1.8)*.5;if(!TLD.beats.some(b=>lt>=b.a&&lt<b.b)){tlTurn({x:pl.x+10,y:pl.y},.2)}}
 }else if(s==1){
  pl.x=X+Math.min(1.5,lt*1.2);pl.y=Y+Math.sin(lt*1.6)*.35;

 }else{

  if(F.kl&&!F.dd){const k=en[1],u=Math.min(1,(lt-2.7)/1.0);k.x=pl.x+9-u*2.2;k.y=pl.y+2.4-u*1.6;k.a=Math.atan2(pl.y-k.y,pl.x-k.x);tlTurn(k,.15);if(lt>=3.0&&!F.s1){F.s1=1;try{if(k.gn){k.ammo=99;k.cd=0;fire(k)}}catch(e){}}if(lt>=3.3&&!F.s2){F.s2=1;try{if(k.gn){k.cd=0;fire(k)}}catch(e){}}}
  if(lt>=3.7&&!F.dd){F.dd=1;const k=en[1];try{k.cd=0;k.rl=0;k.ammo=99;if(k.gn)fire(k)}catch(e){tlErr(e)}pl.kb=k;pl.kh=true;pl.hp=0}

  if(F.dd&&pl.hp>0)pl.hp=0;
 }
 TLD.beats.forEach(b=>{if(lt>=b.a&&lt<b.b+.05)tlBeat(en[b.w],lt-b.a,b)});
